pre-commit:
  piped: true
  jobs:
    - name: oxfmt
      glob: "*.{js,ts,tsx,json,jsonc,yml,yaml,md}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: "*.{js,ts,tsx}"
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
